<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dy="8" result="shadow" />
      <feComponentTransfer in="shadow" result="shadow-faded">
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow-faded" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <!-- macOS Big Sur tile: 824x824 body centered in 1024 canvas (100px padding), 185px radius -->
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#5a8c6e" />
    <!-- Top highlight stroke (inset by ~6px = half stroke width) -->
    <path
      d="M106 285 A179 179 0 0 1 285 106 H739 A179 179 0 0 1 918 285"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.22"
      stroke-width="2"
    />
    <!-- Tabler IconBookmarkFilled, 24-unit path, scaled and centered -->
    <g transform="translate(244, 232) scale(23.3)">
      <path
        fill="#fbfaf6"
        d="M14 2a5 5 0 0 1 5 5v14a1 1 0 0 1 -1.555 .832l-5.445 -3.63l-5.444 3.63a1 1 0 0 1 -1.55 -.72l-.006 -.112v-14a5 5 0 0 1 5 -5h4z"
      />
    </g>
  </g>
</svg>
