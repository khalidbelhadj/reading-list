<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <style>
      body {
        width: auto;
      }
      .settings {
        max-width: 440px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .settings h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .row-title {
        font-size: 13px;
        font-weight: 500;
      }
      .row-desc {
        margin-top: 2px;
        font-size: 12px;
        color: var(--muted-fg);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .field[hidden] {
        display: none;
      }
      .field label {
        font-size: 13px;
        font-weight: 500;
      }
      .hint {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted-fg);
      }
      .actions-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .actions-row .action {
        width: auto;
        min-width: 88px;
      }
      .saved-msg {
        font-size: 12px;
        color: var(--muted-fg);
      }
    </style>
  </head>
  <body>
    <main class="settings">
      <h1>Reading List settings</h1>

      <div class="row">
        <div>
          <div class="row-title">Developer mode</div>
          <div class="row-desc">Point the extension at a local dev server</div>
        </div>
        <button
          id="dev-toggle"
          class="switch"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Developer mode"
        >
          <span class="switch-thumb"></span>
        </button>
      </div>

      <div id="url-field" class="field" hidden>
        <label for="app-url">App URL</label>
        <input
          id="app-url"
          class="app-input"
          type="url"
          placeholder="http://localhost:3000"
        />
        <p class="hint">
          Sign in to this URL in this browser so the extension can use your
          session.
        </p>
      </div>

      <div class="actions-row">
        <button id="save" class="action primary" type="button">Save</button>
        <span id="saved-msg" class="saved-msg" hidden>Saved</span>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
