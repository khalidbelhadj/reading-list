[project]
name = "analysis"
version = "0.1.0"
description = "Data analysis sandbox (polars / numpy / seaborn)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.0",
    "google-genai>=2.8.0",
    "hdbscan>=0.8.44",
    "httpx>=0.28.1",
    "kaleido>=1.3.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "polars>=1.41.2",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.5.1",
    "trafilatura>=2.0.0",
    "umap-learn>=0.5.12",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.8",
]
